name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        run: |
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f "build_type=workflow" || echo "Enable failed, trying branch source"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
