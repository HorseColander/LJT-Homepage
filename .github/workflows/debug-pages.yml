name: Debug Pages enablement
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: write
  id-token: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Debug Pages API and live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GET /pages ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/HorseColander/LJT-Homepage/pages
          echo
          echo "=== HEAD live site ==="
          curl -sI https://HorseColander.github.io/LJT-Homepage/ | head -20
          echo "=== GET live site index (first 60 lines) ==="
          curl -s https://HorseColander.github.io/LJT-Homepage/ | head -60
          echo "=== GET publications page (first 40 lines) ==="
          curl -s https://HorseColander.github.io/LJT-Homepage/publications/ | head -40
          echo
