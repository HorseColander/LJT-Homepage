name: Debug Pages enablement
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: write
  id-token: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Debug Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GET /pages ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/HorseColander/LJT-Homepage/pages
          echo
          echo "=== POST /pages build_type=workflow ==="
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/HorseColander/LJT-Homepage/pages -d '{"build_type":"workflow"}'
          echo
          echo "=== POST /pages build_type=branch (master) ==="
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/HorseColander/LJT-Homepage/pages -d '{"build_type":"branch","branch":{"branch":"master","path":"/"}}'
          echo
